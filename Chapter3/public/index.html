<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App | Node.JS Express.JS SQLite</title>

    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />
</head>

<body>

    <!-- ==================== AUTH SECTION ==================== -->

    <section id="auth">
        <div>
            <h2 class="sign-up-text">Login</h2>
            <p>Create an account!</p>
        </div>

        <p id="error" style="display: none;"></p>

        <input id="emailInput" placeholder="Email" />

        <input
            id="passwordInput"
            placeholder="********"
            type="password"
        />

        <button id="authBtn" onclick="authenticate()">
            Submit
        </button>

        <hr />

        <div class="register-content">
            <p>Don't have an account?</p>

            <button
                onclick="toggleIsRegister()"
                id="registerBtn">
                Sign up
            </button>
        </div>
    </section>


    <!-- ==================== DASHBOARD ==================== -->

    <header style="display: none;">
        <h1 class="text-gradient">
            You have 0 open tasks.
        </h1>
    </header>


    <!-- ==================== NAVIGATION ==================== -->

    <nav style="display: none;" class="tab-container">

        <button
            onclick="changeTab('All')"
            class="tab-button selected-tab">

            <h4>
                All <span>(0)</span>
            </h4>

        </button>


        <button
            onclick="changeTab('Open')"
            class="tab-button">

            <h4>
                Open <span>(0)</span>
            </h4>

        </button>


        <button
            onclick="changeTab('Complete')"
            class="tab-button">

            <h4>
                Complete <span>(0)</span>
            </h4>

        </button>

        <hr />

    </nav>


    <!-- ==================== TODO MAIN ==================== -->

    <main style="display: none;">
    </main>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script>

        // =========================================================
        // AUTH STATE
        // =========================================================

        let token = localStorage.getItem('token')

        let isLoading = false
        let isAuthenticating = false
        let isRegistration = false

        let selectedTab = 'All'

        let todos = []


        // =========================================================
        // API
        // =========================================================

        const apiBase = '/'


        // =========================================================
        // ELEMENTS
        // =========================================================

        const nav = document.querySelector('nav')

        const header = document.querySelector('header')

        const main = document.querySelector('main')

        const navElements = document.querySelectorAll('.tab-button')

        const authContent = document.getElementById('auth')

        const textError = document.getElementById('error')

        const email = document.getElementById('emailInput')

        const password = document.getElementById('passwordInput')

        const registerBtn = document.getElementById('registerBtn')

        const authBtn = document.getElementById('authBtn')


        // =========================================================
        // SHOW LOGIN
        // =========================================================

        function showLogin() {

            nav.style.display = 'none'

            header.style.display = 'none'

            main.style.display = 'none'

            authContent.style.display = 'block'

        }


        // =========================================================
        // SHOW DASHBOARD
        // =========================================================

        async function showDashboard() {

            nav.style.display = 'block'

            header.style.display = 'flex'

            main.style.display = 'flex'

            authContent.style.display = 'none'

            await fetchTodos()

        }


        // =========================================================
        // HEADER
        // =========================================================

        function updateHeaderText() {

            const todosLength = todos.length

            const newString =
                todos.length === 1
                    ? `You have 1 open task.`
                    : `You have ${todosLength} open tasks.`

            header.querySelector('h1').innerText = newString

        }


        // =========================================================
        // NAV COUNTS
        // =========================================================

        function updateNavCount() {

            navElements.forEach(ele => {

                const btnText = ele.innerText.split(' ')[0]

                const count = todos.filter(val => {

                    if (btnText === 'All') {
                        return true
                    }

                    return btnText === 'Complete'
                        ? val.completed
                        : !val.completed

                }).length

                ele.querySelector('span').innerText = `(${count})`

            })

        }


        // =========================================================
        // CHANGE TAB
        // =========================================================

        function changeTab(tab) {

            selectedTab = tab

            navElements.forEach(val => {

                if (val.innerText.includes(tab)) {

                    val.classList.add('selected-tab')

                } else {

                    val.classList.remove('selected-tab')

                }

            })

            renderTodos()

        }


        // =========================================================
        // RENDER TODOS
        // =========================================================

        function renderTodos() {

            updateNavCount()

            updateHeaderText()

            let todoList = ``


            todos
                .filter(val => {

                    return selectedTab === 'All'
                        ? true
                        : selectedTab === 'Complete'
                            ? val.completed
                            : !val.completed

                })
                .forEach((todo, todoIndex) => {

                    const taskIndex = todo.id

                    todoList += `

                        <div class="card todo-item">

                            <p>
                                ${todo.task}
                            </p>

                            <div class="todo-buttons">

                                <button
                                    onclick="updateTodo(${taskIndex})"
                                    ${todo.completed ? 'disabled' : ''}>

                                    <h6>
                                        Done
                                    </h6>

                                </button>


                                <button
                                    onclick="deleteTodo(${taskIndex})">

                                    <h6>
                                        Delete
                                    </h6>

                                </button>

                            </div>

                        </div>

                    `

                })


            // Add todo input

            todoList += `

                <div class="input-container">

                    <input
                        id="todoInput"
                        placeholder="Add task"
                    />

                    <button onclick="addTodo()">

                        <i class="fa-solid fa-plus"></i>

                    </button>

                </div>

            `


            main.innerHTML = todoList

        }


        // =========================================================
        // REGISTER / LOGIN TOGGLE
        // =========================================================

        async function toggleIsRegister() {

            isRegistration = !isRegistration

            registerBtn.innerText =
                isRegistration
                    ? 'Sign in'
                    : 'Sign up'


            document.querySelector('#auth > div h2').innerText =
                isRegistration
                    ? 'Sign Up'
                    : 'Login'


            document.querySelector('.register-content p').innerText =
                isRegistration
                    ? 'Already have an account?'
                    : "Don't have an account?"


            document.querySelector('.register-content button').innerText =
                isRegistration
                    ? 'Sign in'
                    : 'Sign up'

        }


        // =========================================================
        // AUTHENTICATION
        // =========================================================

        async function authenticate() {

            const emailVal = email.value

            const passVal = password.value


            // Guard clauses

            if (
                isLoading ||
                isAuthenticating ||
                !emailVal ||
                !passVal ||
                passVal.length < 6 ||
                !emailVal.includes('@')
            ) {

                return

            }


            // Reset error

            textError.style.display = 'none'

            isAuthenticating = true

            authBtn.innerText = 'Authenticating...'


            try {

                let data


                // =================================================
                // REGISTER
                // =================================================

                if (isRegistration) {

                    const response = await fetch(
                        apiBase + 'auth/register',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify({
                                username: emailVal,
                                password: passVal
                            })
                        }
                    )


                    data = await response.json()

                }


                // =================================================
                // LOGIN
                // =================================================

                else {

                    const response = await fetch(
                        apiBase + 'auth/login',
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify({
                                username: emailVal,
                                password: passVal
                            })
                        }
                    )


                    data = await response.json()

                }


                // =================================================
                // TOKEN RECEIVED
                // =================================================

                if (data.token) {

                    token = data.token

                    localStorage.setItem('token', token)

                    authBtn.innerText = 'Loading...'


                    // Verify token by fetching todos

                    const authenticated = await fetchTodos()


                    if (authenticated) {

                        showDashboard()

                    }

                }

                else {

                    throw Error(
                        data.message || 'Failed to authenticate...'
                    )

                }


            } catch (err) {

                console.log(err.message)

                textError.innerText = err.message

                textError.style.display = 'block'

            } finally {

                authBtn.innerText = 'Submit'

                isAuthenticating = false

            }

        }


        // =========================================================
        // LOGOUT
        // =========================================================

        function logout() {

            // Remove JWT from browser

            localStorage.removeItem('token')

            token = null

            // Clear todos

            todos = []

            // Show login screen

            showLogin()

        }


        // =========================================================
        // FETCH TODOS
        // =========================================================

        async function fetchTodos() {

            isLoading = true


            try {

                const response = await fetch(
                    apiBase + 'todos',
                    {
                        headers: {
                            'Authorization': token
                        }
                    }
                )


                // =================================================
                // TOKEN INVALID / EXPIRED
                // =================================================

                if (response.status === 401) {

                    console.log(
                        'Token expired or invalid'
                    )

                    localStorage.removeItem('token')

                    token = null

                    todos = []

                    showLogin()

                    return false

                }


                // =================================================
                // OTHER SERVER ERROR
                // =================================================

                if (!response.ok) {

                    throw new Error(
                        'Failed to fetch todos'
                    )

                }


                const todosData = await response.json()

                todos = todosData


                renderTodos()

                return true


            } catch (err) {

                console.log(err.message)

                return false

            } finally {

                isLoading = false

            }

        }


        // =========================================================
        // UPDATE TODO
        // =========================================================

        async function updateTodo(index) {

            const todo = todos.find(
                val => val.id === index
            )


            if (!todo) {
                return
            }


            await fetch(
                apiBase + 'todos' + '/' + index,
                {
                    method: 'PUT',

                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },

                    body: JSON.stringify({
                        task: todo.task,
                        completed: 1
                    })
                }
            )


            fetchTodos()

        }


        // =========================================================
        // DELETE TODO
        // =========================================================

        async function deleteTodo(index) {

            await fetch(
                apiBase + 'todos' + '/' + index,
                {
                    method: 'DELETE',

                    headers: {
                        'Authorization': token
                    }
                }
            )


            fetchTodos()

        }


        // =========================================================
        // ADD TODO
        // =========================================================

        async function addTodo() {

            const todoInput =
                document.getElementById('todoInput')


            const task = todoInput.value


            if (!task) {
                return
            }


            await fetch(
                apiBase + 'todos',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },

                    body: JSON.stringify({
                        task
                    })
                }
            )


            todoInput.value = ''

            fetchTodos()

        }


        // =========================================================
        // PAGE LOAD / AUTH CHECK
        // =========================================================

        async function checkAuthentication() {

            // No token → Login

            if (!token) {

                showLogin()

                return

            }


            // Token exists → verify with backend

            const authenticated = await fetchTodos()


            if (authenticated) {

                showDashboard()

            } else {

                showLogin()

            }

        }


        // =========================================================
        // START APPLICATION
        // =========================================================

        checkAuthentication()

    </script>

</body>

</html>
